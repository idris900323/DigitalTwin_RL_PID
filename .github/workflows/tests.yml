name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the base-code oracle tests read commit ffd4835 from history; with CI=true they FAIL without it
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          playwright install --with-deps chromium
      - name: Test
        run: pytest tests
        env:
          MPLBACKEND: Agg

  pybullet:
    # PyBullet has no Windows wheel for Python 3.12 (docs/pybullet_install_windows.md); Linux builds/installs it, so the PyBullet tests run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pybullet
      - name: PyBullet tests (must not skip)
        run: |
          python -c "import pybullet"
          pytest tests/test_pybullet_sim.py -rs
        env:
          MPLBACKEND: Agg
