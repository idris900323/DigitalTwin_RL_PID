algo: td3
hyperparameters:
  policy: MlpPolicy
  net_arch:
  - 64
  - 64
  learning_rate: 0.0001
  buffer_size: 200000
  batch_size: 256
  gamma: 0.99
common:
  seeds:
  - 0
  - 1
  - 2
  total_timesteps: 200000
  eval_freq: 10000
  n_eval_episodes: 30
  save_checkpoints: true
  env:
    action_mode: residual
    n_stack: 1
    change_prob:
      payload: 0.3
      target: 0.3
    rl_env_overrides:
      reward:
        w_band: 1.0
      residual:
        span: 1.5
        ki_add: 10.0
