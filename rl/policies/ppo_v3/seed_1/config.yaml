algo: ppo
hyperparameters:
  policy: MlpPolicy
  net_arch:
  - 64
  - 64
  learning_rate: 0.0001
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  log_std_init: -1.0
common:
  seeds:
  - 0
  - 1
  - 2
  total_timesteps: 400000
  eval_freq: 10000
  n_eval_episodes: 30
  save_checkpoints: true
  env:
    action_mode: residual
    n_stack: 1
    change_prob:
      payload: 0.3
      target: 0.3
    rl_env_overrides:
      reward:
        w_band: 1.0
