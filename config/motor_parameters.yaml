# RMCS-3013 / RMCS-3070 Johnson Quad-Encoder Geared DC Motor
# All values tagged with provenance in comments: DATASHEET / CALCULATED / ESTIMATED / ASSUMED
# See datasheet/parameter_table.md for full derivation and flags.
# All values below are SI unless a unit suffix says otherwise (kept for traceability).

supply:
  V_rated: 12.0  # V, DATASHEET

gearbox:
  ratio: 180.0  # DATASHEET
  efficiency: 0.80  # ESTIMATED, typical small spur/planetary gearbox

encoder:
  hall_sensors: 13  # DATASHEET
  quadrature_multiplier: 4  # DATASHEET
  base_cpr: 52  # DATASHEET (13 * 4)
  output_cpr: 9360  # DATASHEET (52 * 180), confirmed exact
  noise_counts_rms: 0.0  # ASSUMED ideal encoder by default; RMS jitter in counts (the tuner trains with 1 count)

base_motor:
  # Datasheet-stated operating points (base motor = before gearbox)
  no_load_speed_rpm: 18000.0  # DATASHEET
  no_load_current_A: 0.8  # DATASHEET
  rated_torque_gcm: 151.0  # DATASHEET as printed; FLAGGED — numerically equals
                           # (output stall torque / gear ratio) at 100% efficiency,
                           # likely a reflected value, not an independent measurement.
                           # Not used as an independent data point in derivations.
  load_current_max_A: 7.5  # DATASHEET ("up to 7.5A (Max)") — NOT explicitly
                            # confirmed to be locked-rotor stall current.

  # Electrical/mechanical parameters — two independent derivation methods retained
  # in parallel (do not collapse into a single value without justification).
  derived:
    method_a:
      # Assumes load_current_max_A == stall current; gearbox eta=1 for reflection
      description: "Stall-based: R = V/i_stall; Kt from reflected base stall torque / i_stall"
      R_ohm: 1.6            # CALCULATED (low confidence, depends on stall-current assumption)
      Kt_Nm_per_A: 1.974e-3 # CALCULATED (low confidence)
      Ke_V_s_per_rad: 1.974e-3  # CALCULATED, Ke ~= Kt (ideal SI identity)
    method_b:
      description: "No-load-speed based: Ke = V / omega_no_load, neglects R*i_no_load drop"
      Ke_V_s_per_rad: 6.366e-3  # CALCULATED (low confidence)
      R_ohm: null           # not determinable by this method
      Kt_Nm_per_A: null     # not determinable by this method
    method_c:
      # Hybrid: keeps method_a's R and Kt (from the stall relationship), but
      # takes Ke from method_b's no-load-speed fit instead of forcing Ke=Kt.
      # This is a deliberate departure from the ideal-motor identity Ke=Kt,
      # not a silent fix -- real brushed motors' Kt/Ke can differ due to
      # iron/brush losses, and this substitution is checked, not asserted:
      # simulating this parameter set open-loop (no load) yields a no-load
      # speed of ~15,968 RPM vs the datasheet's 18,000 RPM (-11%), a large
      # improvement over method_a alone (+121% error, see
      # simulation/simulate_motor.py). Still CALCULATED, medium confidence
      # (better cross-check than A or B alone, but not validated against
      # real hardware).
      description: "Hybrid: R,Kt from method_a (stall); Ke from method_b (no-load speed)"
      R_ohm: 1.6
      Kt_Nm_per_A: 1.974e-3
      Ke_V_s_per_rad: 6.366e-3

  # Not derivable from the datasheet at all — order-of-magnitude placeholders only.
  estimated:
    L_H: 0.0              # ASSUMED negligible (electrical time constant << mechanical)
    Jm_kgm2: 5.0e-7        # ESTIMATED, order-of-magnitude, wide uncertainty
    Bm_Nms_per_rad: 1.0e-6 # ESTIMATED, order-of-magnitude, wide uncertainty

output:
  # Gearbox-output-side datasheet values (do not mix with base_motor values
  # without going through gear ratio explicitly)
  rated_speed_rpm: 100.0       # DATASHEET
  stall_torque_kgcm: 27.18     # DATASHEET
  rated_torque_kgcm: 12.5      # DATASHEET

mass_g: 180.0  # DATASHEET

mechanical_dims_mm:  # DATASHEET, from RMCS-3013 mechanical drawing
  flange_diameter: 31.0
  bolt_circle_diameter: 26.85
  mounting_hole_count: 4
  mounting_hole_spec: "M2.5x6"
  output_shaft_diameter: 6.0
  output_shaft_length_100rpm: 26.5
  gearbox_body_diameter: 36.0
  motor_body_diameter: 30.0
  total_length: 55.50

simulation:
  # Design choices for the digital twin, not hardware specs.
  control_loop_dt_s: 0.001  # ASSUMED, 1 kHz, configurable
  active_electrical_scenario: "method_c"  # which derived.* block the closed-loop twin uses by default
  theta_ref_default_deg: 90.0  # ASSUMED default step-reference target for the PID demo
  run_duration_s: 2.0  # ASSUMED default sim window for the interactive PID demo

pid_defaults:
  # Starting gains for the demos: the "Tuned" preset, found by grid search on
  # the method_c twin (90 deg step, bare shaft: ~1.7 % overshoot, ~0.29 s
  # settling). CALCULATED/preliminary -- not validated on hardware.
  # Kp in V/rad, Ki in V/(rad*s), Kd in V*s/rad.
  Kp: 15.0
  Ki: 0.0
  Kd: 0.3
  Kp_max: 50.0
  Ki_max: 200.0
  Kd_max: 1.0

controller:
  derivative_filter_tau_s: 0.01  # ASSUMED, first-order filter on the PID derivative term

driver:
  # Optional motor-driver current limit. ASSUMED absent (null) because the real driver is not chosen yet.
  # L = 0: limits the armature current exactly. L > 0: steady-state approximation (documented in digital_twin.py).
  current_limit_A: null
  delay_steps: 0  # ASSUMED none; command latency in control samples (driver/communication dead time)

joint:
  # Load model, output-shaft side. All terms ASSUMED OFF: the real values are unknown. See models/joint.py
  # for the conventions (0 deg = hanging, thin-rod arm, point-mass payload, smooth Coulomb friction).
  payload_mass_kg: 0.0
  arm_length_m: 0.0
  arm_mass_kg: 0.0          # uniform thin rod, centre of gravity at L/2
  gravity_on: false
  B_joint_Nms_per_rad: 0.0  # viscous friction, UNKNOWN
  tau_coulomb_Nm: 0.0       # Coulomb friction, UNKNOWN
  omega_eps_rad_s: 0.01     # width of the smooth sign function
  # TODO (not implemented, no parameters yet): gearbox backlash (dead zone) and torsional compliance.

feasibility:
  # Margin = available output stall torque / peak gravity holding torque on the path.
  # Below 1.0 the payload cannot be driven to the target; below this value it is "marginal".
  marginal_margin: 1.2  # ASSUMED, design choice

# Parameter ranges for the sensitivity study (simulation/sensitivity.py), set by provenance confidence.
sensitivity_ranges:
  datasheet_rel: 0.05             # DATASHEET values: +-5 %
  calculated_rel: 0.20            # CALCULATED values: +-20 %
  assumed_rel: 0.50               # ASSUMED / ESTIMATED values: +-50 %
  order_of_magnitude_factor: 3.0  # Jm, Bm are order-of-magnitude placeholders: [nominal/3, nominal*3], log-uniform
  parameters:
    V_supply: {tier: datasheet}
    R: {tier: calculated}
    Kt: {tier: calculated}
    Ke: {tier: calculated}
    Jm: {tier: order_of_magnitude}
    Bm: {tier: order_of_magnitude}
    eta: {tier: assumed, clip: [0.2, 1.0]}
    L: {tier: absolute, min: 1.0e-4, max: 5.0e-3}   # H; nominal is 0 (neglected), so an absolute range is used
    delay_steps: {tier: integer, min: 0, max: 3}     # control samples

# Master prompt s15 test sequence (simulation/simulate_pid.py): low P -> higher P -> P+D -> P+I -> full PID,
# plus the legacy default for context. Gains are CALCULATED/preliminary (found on the method_c twin).
pid_test_sequence:
  - {name: "1 low P", Kp: 1.5, Ki: 0.0, Kd: 0.0}
  - {name: "2a higher P", Kp: 15.0, Ki: 0.0, Kd: 0.0}
  - {name: "2b highest P", Kp: 45.0, Ki: 0.0, Kd: 0.0}
  - {name: "3 P+D (Tuned)", Kp: 15.0, Ki: 0.0, Kd: 0.3}
  - {name: "4 P+I", Kp: 15.0, Ki: 20.0, Kd: 0.0}
  - {name: "5 full PID", Kp: 15.0, Ki: 5.0, Kd: 0.3}
  - {name: "legacy default", Kp: 5.0, Ki: 20.0, Kd: 0.05}

# Named presets, for comparisons. All measured on the method_c twin, 90 deg step.
pid_presets:
  legacy_default: {Kp: 5.0, Ki: 20.0, Kd: 0.05}  # old demo default: 42 % overshoot, 1.8 s settling
  sluggish: {Kp: 1.5, Ki: 0.0, Kd: 0.0}
  oscillatory: {Kp: 45.0, Ki: 0.0, Kd: 0.0}
  tuned: {Kp: 15.0, Ki: 0.0, Kd: 0.3}
